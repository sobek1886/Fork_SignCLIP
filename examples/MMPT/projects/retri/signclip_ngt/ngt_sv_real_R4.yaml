# Real-signer-count ablation R4 (sessions 251126 260129 251217 260316; 200 sentences x 1 take,
# fixed-data): same recipe as the parent arm, only the manifest differs.
# Flux-vs-Unreal comparison — E1: baseline, real FRONT view only, K=1.
# (The FRONT camera is the view labeled RIGHT in the recording filenames.)
# SupCon has no positives at K=1, so this arm uses VidNCELoss (video-only
# instance discrimination). All sessions; repeat takes sampled per step.
# 1*192=192 encoder passes per step (constant budget across arms).
#
# Prerequisite: run make_ngt_singleview_manifest.py (writes every arm's
# manifest; all arms share the identical sentence set).
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: NGTPairMetaProcessor
  video_processor: NGTPairVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  pair_manifest: /home/psobecki/ngt_sv_real_R4_manifest.json
  load_real: true
  load_unreal: false        # manifest has no unreal entries for this arm anyway
  aligner: NGTPairAligner
  vfeat_dim: 768
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    # 1*192=192 encoder passes per step ≈ same budget as baseline 3*64=192
    batch_size: 192
    disable_validation: true
  optimization:
    lr: [5.0e-05]
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 700
    warmup_updates: 140
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_real_R4
task_type: sweep_small
task: NGTPairTask
mlflow_experiment: signclip-ngt
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: VidNCELoss
eval:
  save_path: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_real_R4
