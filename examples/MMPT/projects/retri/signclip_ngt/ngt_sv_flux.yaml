# Flux-vs-Unreal comparison — E4: FRONT + the two identity-changing Flux
# edits (signer_swap + skin_mst_diffusion), SupCon K=3 — matched to
# ngt_sv_unreal's (E3) K and its "2 synthetic identities of the same view"
# structure. This is the matched-composition head-to-head against E3.
# 3*64=192 encoder passes per step (constant budget across arms).
#
# Prerequisites:
#   1. Extract Flux NGT features for ALL sessions:
#      sbatch extract_logos_features_ngt_flux.job (Fork_Logos).
#   2. Run make_ngt_singleview_manifest.py (writes every arm's manifest;
#      all arms share the identical sentence set).
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: NGTPairMetaProcessor
  video_processor: NGTPairVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  pair_manifest: /home/psobecki/ngt_sv_flux_manifest.json
  load_real: true
  load_unreal: true
  aligner: NGTPairAligner
  vfeat_dim: 768
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    # 3*64=192 encoder passes per step ≈ same budget as baseline 3*64=192
    batch_size: 64
    disable_validation: true
  optimization:
    lr: [5.0e-05]
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 600
    warmup_updates: 60
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_flux
task_type: sweep_small
task: NGTPairTask
mlflow_experiment: signclip-ngt
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: SupConLoss
  supcon_temperature: 0.07
eval:
  save_path: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_flux
