# Flux-vs-Unreal single-view comparison — ARM 3: real RIGHT view + same-view
# Flux appearance variants (signer_swap + skin_mst_diffusion by default, the
# two identity-changing edits), SupConLoss K=3 — matched to ngt_sv_unreal's
# K and to its "2 synthetic identities of the same view" structure.
# 3*64=192 encoder passes per step ≈ same budget as baseline 3*64=192.
#
# Prerequisites:
#   1. Extract Flux NGT features: sbatch extract_logos_features_ngt_flux.job
#      (Fork_Logos) on the 2026-03-16 (piotrAnims-session) date batch.
#   2. Run make_ngt_singleview_manifest.py (writes all three
#      ngt_sv_*_manifest.json files; all arms share the identical sign set).
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: NGTPairMetaProcessor
  video_processor: NGTPairVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  pair_manifest: /home/psobecki/ngt_sv_flux_manifest.json
  load_real: true
  load_unreal: true
  aligner: NGTPairAligner
  vfeat_dim: 768
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    # 3*64=192 encoder passes per step ≈ same budget as baseline 3*64=192
    batch_size: 64
    disable_validation: true
  optimization:
    lr: [5.0e-05]
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 700
    warmup_updates: 140
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_flux
task_type: sweep_small
task: NGTPairTask
mlflow_experiment: signclip-ngt
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: SupConLoss
  supcon_temperature: 0.07
eval:
  save_path: /scratch-shared/psobecki/runs/retri_ngt/ngt_sv_flux
