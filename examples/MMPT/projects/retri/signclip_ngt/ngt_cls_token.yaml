# Diagnostic B: SupConLoss on the [CLS] token output from MMFusionSeparate.
# The current pooling in forward_video explicitly zeros out the CLS position.
# This config tests whether the CLS token (which aggregates global context via
# self-attention) is a better appearance-invariant representation than the
# current masked mean of video frame positions.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: NGTPairMetaProcessor
  video_processor: NGTPairVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  pair_manifest: /home/psobecki/ngt_pair_manifest.json
  load_unreal: true         # K=9: same views as ngt_appearance_invariant
  aligner: NGTPairAligner
  vfeat_dim: 768
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 21
    disable_validation: true
  optimization:
    lr: [5.0e-05]
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 700
    warmup_updates: 140
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: /scratch-shared/psobecki/runs/retri_ngt/ngt_cls_token
task_type: sweep_small
task: NGTPairTask
mlflow_experiment: signclip-ngt
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
  use_cls_token: true       # return video_outputs[:, 0, :] instead of pooled average
loss:
  loss_cls: SupConLoss
  supcon_temperature: 0.07
eval:
  save_path: /scratch-shared/psobecki/runs/retri_ngt/ngt_cls_token
