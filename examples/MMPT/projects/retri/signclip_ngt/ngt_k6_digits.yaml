# Synthetic-signer-count ablation arm: 3 piotrAnims views + 3 digits views,
# SupConLoss K=6. Middle point between ngt_baseline (K=3, 0 synthetic signers)
# and ngt_appearance_invariant (K=9, 2 synthetic signers).
# Compare against ngt_k6_palmer to control for which avatar carries the gain.
# 6*32=192 encoder passes per step ≈ same memory budget as baseline 3*64=192.
#
# Prerequisite: run make_ngt_pair_manifest.py to produce ngt_pair_manifest.json.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: NGTPairMetaProcessor
  video_processor: NGTPairVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  # pair_manifest is consumed by NGTPairMetaProcessor and NGTPairVideoProcessor
  pair_manifest: /home/psobecki/ngt_pair_manifest.json
  load_real: true           # load piotrAnims views
  load_unreal: true
  unreal_character: 1       # 1 = digits views only (manifest slots 3-5)
  aligner: NGTPairAligner
  # vfeat_dim must match Logos output (768)
  vfeat_dim: 768
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    # 6*32=192 encoder passes per step ≈ same memory budget as baseline 3*64=192
    batch_size: 32
    disable_validation: true
  optimization:
    lr: [5.0e-05]
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 700
    warmup_updates: 140
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: /scratch-shared/psobecki/runs/retri_ngt/ngt_k6_digits
task_type: sweep_small
task: NGTPairTask
mlflow_experiment: signclip-ngt
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: SupConLoss
  supcon_temperature: 0.07
eval:
  save_path: /scratch-shared/psobecki/runs/retri_ngt/ngt_k6_digits
