# CNN-based SignCLIP trained from scratch on ASL-Citizen.
# Uses pre-extracted I3D BSL-5K (136MB M+D+A) features instead of pose.
# Both BERT encoders initialise from bert-base-cased (no Spreadthesign pre-training).
# Comparable to "SignCLIP train from scratch" in Table 5 of the SignCLIP paper,
# but with I3D features instead of MediaPipe pose (vfeat_dim 609→1024).
#
# Prerequisite — extract features:
#   python extract_asl_citizen_i3d_features.py \
#       --video_dir  <asl_citizen_videos> \
#       --output_dir <i3d_feature_dir> \
#       --i3d_weights <136mb_model.pth.tar> \
#       --bsl1k_root  <path/to/bsl1k>
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/i3d_features
  vfeat_custom: 1                # keep full 1024-dim (skip 512 pooling in RWTHFSVideoProcessor)
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 1000
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 1.0e-04
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 500
    weight_decay: 0.0
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/asl_citizen_cnn_scratch
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 1024
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_cnn_scratch
