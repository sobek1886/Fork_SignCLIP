# CNN-based SignCLIP fine-tuning on ASL-Citizen
# Uses pre-extracted I3D BSL-1K CVPR'21 (136MB M+D+A) features instead of pose.
#
# Prerequisites:
#   1. Extract features:
#        python extract_asl_citizen_i3d_features.py \
#            --video_dir  <asl_citizen_videos> \
#            --output_dir <i3d_feature_dir> \
#            --i3d_weights <136mb_model.pth.tar> \
#            --bsl1k_root  <path/to/bsl1k>
#
#   2. Prepare CNN-ready checkpoint (strips videomlp.linear1.weight):
#        python prepare_cnn_checkpoint.py \
#            --input  runs/retri_v1_1/baseline_temporal/checkpoint_best.pt \
#            --output runs/retri_v1_1/baseline_temporal_cnn_ready.pt
dataset:
  max_video_len: 32          # I3D clips per video (much shorter than pose frames)
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/i3d_features
  vfeat_custom: 1                # keep full 1024-dim (skip 512 pooling in RWTHFSVideoProcessor)
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true         # temporal speed jitter still applies to clip sequences
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 1000
  dataset:
    num_workers: 4
    batch_size: 256              # I3D clips are shorter → can use larger batches
  optimization:
    lr:
    - 5.0e-05
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 200
    weight_decay: 0.0
    ddp_backend: no_c10d
    max_epoch: 25
  checkpoint:
    # Phase 1 checkpoint: videomlp trained on I3D, BERT from E7.2
    restore_file: runs/retri_asl/asl_citizen_cnn_phase1/checkpoint_best.pt
    no_epoch_checkpoints: true
    reset_optimizer: true
    reset_dataloader: true
    reset_meters: true
    save_dir: runs/retri_asl/asl_citizen_cnn_finetune
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 1024               # I3D output dimension
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_cnn_finetune
