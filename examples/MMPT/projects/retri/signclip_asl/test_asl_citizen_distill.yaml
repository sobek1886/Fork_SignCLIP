# Test config for distillation-trained MediaPipe model.
# No teacher needed at test time — uses standard DSAligner and MMContraLoss.
dataset:
  max_video_len: 256
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSPoseProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: null
  val_path: null
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/mediapipe_poses
  aligner: DSAligner
  sp_universal_tagging: true
  train_for_test: true
  pose_components: 'reduced_face'
  normalize_hand: false
  flip_pose: false
  augment2d: false
  augment_temporal: false
  augment_temporal_chance: 0.5
  gaussian_noise: false
  preprocess: null
  anonym_pose: false
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 5.0e-05
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 500
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/asl_citizen_distill
    restore_file: runs/retri_asl/asl_citizen_distill/checkpoint_best.pt
    reset_optimizer: true
    reset_dataloader: true
    reset_meters: true
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 609
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_distill
