# SGD fine-tune of the ASL-Citizen baseline on augmented (orig+aug) data.
# Tests the Keskar & Socher (2017) "switch Adam -> SGD" idea: the baseline was
# trained with Adam (fast convergence), this fine-tune phase uses SGD+momentum
# for (hypothesised) better generalisation. Same data/recipe as
# asl_citizen_cnn_aug_logos_ft EXCEPT the optimizer.
#
# NOTE: SGD's learning rate is on a totally different scale from Adam's. lr=1e-3
# is a STARTING guess for the sweep; the useful range is ~5e-4 .. 1e-2. Sweep it
# (see asl_citizen_cnn_aug_logos_ft_sgd_lr*.yaml) before trusting any single run.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits_aug
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/logos_features
  dataset_name: asl_citizen
  vfeat_custom: 1
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 1.0e-03
    clip_norm: 2.0
    optimizer: sgd
    momentum: 0.9
    lr_scheduler: polynomial_decay
    total_num_update: 100000
    warmup_updates: 200
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/asl_citizen_cnn_aug_logos_ft_sgd
    restore_file: runs/retri_asl/asl_citizen_cnn_scratch_logos_nowd/checkpoint_best.pt
    reset_optimizer: true
    reset_lr_scheduler: true
    reset_meters: true
    reset_dataloader: true
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_cnn_aug_logos_ft_sgd
mlflow_experiment: signclip-cnn
