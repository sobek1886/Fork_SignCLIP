# Appearance-augmentation fine-tune of the ASL-Citizen baseline.
# Same as asl_citizen_cnn_aug_logos but starts from the trained baseline
# checkpoint instead of from scratch. Faster convergence.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits_aug
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /scratch-shared/psobecki/ASL_Citizen/logos_features_run_sdda
  dataset_name: asl_citizen
  vfeat_custom: 1
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 1.0e-05
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 100000
    warmup_updates: 200
    weight_decay: 0.01
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/signclip_augft_on_sdda
    restore_file: runs/retri_asl/signclip_scratch_on_sdda/checkpoint_last.pt
    reset_optimizer: true
    reset_lr_scheduler: true
    reset_meters: true
    reset_dataloader: true
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/signclip_augft_on_sdda
mlflow_experiment: signclip-cnn
