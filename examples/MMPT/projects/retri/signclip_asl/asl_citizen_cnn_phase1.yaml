# Phase 1: train only VideoTokenMLP with BERT encoders frozen.
# All BERT parameters (video + text encoder) are frozen; only
# videomlp.linear1, videomlp.linear2, videomlp.LayerNorm are updated.
# This lets the projection head learn to map I3D features into the
# embedding space that the pretrained BERT already understands before
# we fine-tune the full model in Phase 2.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/i3d_features
  vfeat_custom: 1
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 100
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 1.0e-03
    clip_norm: 1.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 50
    weight_decay: 0.0
    ddp_backend: no_c10d
    max_epoch: 5
  checkpoint:
    restore_file: runs/retri_v1_1/baseline_temporal_cnn_ready.pt
    no_epoch_checkpoints: true
    reset_optimizer: true
    reset_dataloader: true
    reset_meters: true
    save_dir: runs/retri_asl/asl_citizen_cnn_phase1
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 1024
  freeze_bert: true          # freeze video+text BERT, train only videomlp
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_cnn_phase1
