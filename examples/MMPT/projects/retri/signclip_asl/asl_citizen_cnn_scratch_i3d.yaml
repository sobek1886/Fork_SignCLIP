# SignCLIP from scratch on ASL-Citizen, using BSL-5K I3D features (i3d_features, 1024-d).
# This is the STAGE-1 baseline that the i3d fine-tune configs resume from.
# Mirrors asl_citizen_cnn_scratch_logos_nowd.yaml but with I3D features.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /home/psobecki/ASL_Citizen/i3d_features
  dataset_name: asl_citizen
  vfeat_custom: 1                # keep full 1024-d (skip RWTHFSVideoProcessor pooling)
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 5.0e-05
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 500
    weight_decay: 0.0
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/asl_citizen_cnn_scratch_i3d
task_type: sweep_small
mlflow_experiment: signclip-cnn
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 1024
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/asl_citizen_cnn_scratch_i3d
