# CNN-based SignCLIP trained from scratch on ASL-Citizen.
# Uses pre-extracted MViTv2-S Logos features instead of I3D.
# Comparable to asl_citizen_cnn_scratch_logos but with no weight decay.
dataset:
  max_video_len: 32
  max_len: 64
  meta_processor: SignCLIPVideoCSVMetaProcessor
  video_processor: RWTHFSVideoProcessor
  text_processor: TextProcessor
  bert_name: bert-base-cased
  splits_dir: /home/psobecki/ASL_Citizen/splits
  train_path: placeholder
  val_path: placeholder
  test_path: placeholder
  vfeat_dir: /scratch-shared/psobecki/ASL_Citizen/logos_features_run2
  vfeat_custom: 1
  aligner: DSAligner
  sp_universal_tagging: true
  augment_temporal: true
fairseq:
  common:
    fp16: true
    tensorboard_logdir: run
    log_interval: 20
  dataset:
    num_workers: 4
    batch_size: 256
  optimization:
    lr:
    - 5.0e-05
    clip_norm: 2.0
    optimizer: adam
    adam_betas: (0.9, 0.98)
    lr_scheduler: polynomial_decay
    total_num_update: 1000000
    warmup_updates: 500
    weight_decay: 0.0
    ddp_backend: no_c10d
    max_epoch: 50
  checkpoint:
    no_epoch_checkpoints: true
    save_dir: runs/retri_asl/signclip_scratch_on_ce
task_type: sweep_small
model:
  model_cls: MMFusionSeparate
  mm_encoder_cls: null
  video_encoder_cls: MMBertForEncoder
  text_encoder_cls: BertModel
  num_hidden_video_layers: 12
  vfeat_dim: 768
loss:
  loss_cls: MMContraLoss
eval:
  save_path: runs/retri_asl/signclip_scratch_on_ce
